x-backup-env: &backup-env
  AWS_ACCESS_KEY_ID: ${B2_ID}
  AWS_SECRET_ACCESS_KEY: ${B2_KEY}
  OPTIONS: --no-encryption --s3-endpoint-url ${B2_S3_ENDPOINT} --s3-region-name ${B2_S3_REGION}
  # Nightly schedule: every backup container on the host, across all sites, gets its
  # own slot, 10 minutes apart, between 00:00 and 04:00 UTC. This site's two slots are
  # BACKUP_SLOT_CONTENT and BACKUP_SLOT_ACCOUNTS in .env. Before adding or moving a slot, list what is running:
  #   docker --context "$SERVER" ps --format '{{.Names}}' | grep backups | while read -r c; do
  #     docker --context "$SERVER" inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$c" \
  #       | grep '^CRONTAB_DAILY=' | sed "s|^|$c |"; done
  # and take a free slot.
  JOB_300_WHAT: dup --full-if-older-than 1M $$SRC $$DST
  JOB_300_WHEN: daily
  JOB_400_WHAT: dup remove-all-but-n-full 3 --force $$DST
  JOB_400_WHEN: daily

volumes:
  content:
    external: true
    name: ${SLD}-stg-content
  content-prod:
    external: true
    name: ${SLD}-prod-content
  media:
    external: true
    name: ${SLD}-stg-media
  sessions:
    external: true
    name: ${SLD}-stg-sessions
  accounts:
    external: true
    name: ${SLD}-accounts
  cache-prod:
    external: true
    name: ${SLD}-prod-cache
  # duplicity chain metadata; persisting it across recreates saves the
  # backup a full re-sync from B2 (one cache per backup container)
  backup-cache-content:
    name: ${SLD}-backup-cache-content-stg
  backup-cache-accounts:
    name: ${SLD}-backup-cache-accounts-stg
services:
  stg:
    build: .
    image: ${IMAGE}:stg
    volumes:
      - content:/app/content
      - content-prod:/app/content-prod
      - media:/app/public/media
      - cache-prod:/app/storage-prod/cache
      - sessions:/app/storage/sessions
      - accounts:/app/storage/accounts
    environment:
      SERVER_NAME: stg.${SLD}.${TLD}
      VIRTUAL_HOST: stg.${SLD}.${TLD}
      ENABLE_PANEL: 'true'
      ENABLE_PW: 'true'
      LETSENCRYPT_HOST: stg.${SLD}.${TLD}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # app secrets and settings from the 1Password Environment (.env)
      EMAIL_TRANSPORT_HOST: ${EMAIL_TRANSPORT_HOST}
      EMAIL_TRANSPORT_USERNAME: ${EMAIL_TRANSPORT_USERNAME}
      EMAIL_TRANSPORT_PASSWORD: ${EMAIL_TRANSPORT_PASSWORD}
      WEBHOOKS_ENDPOINT: ${WEBHOOKS_ENDPOINT}
      DEPLOY_CONTENT_HOOK: ${DEPLOY_CONTENT_HOOK}
      DEPLOY_CONTENT_KEY: ${DEPLOY_CONTENT_KEY}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
    container_name: ${SLD}-stg
    restart: always
  backups-content-stg:
    # Maintenance (2026-11-06): this digest is Alpine 3.23.0 with
    # openssh-server 10.2_p1-r0, which predates the fix for CVE-2026-123158
    # ("sshole", sshd password bypass on musl without PAM). sshd never runs in
    # this container and no port is published, so the bug is unreachable.
    # On the next maintenance round, move every duplicity service in this file
    # to a newer edge digest whose openssh-server carries the fix (Alpine
    # security build or OpenSSH 10.6p2 or later). Check a candidate with:
    #   docker run --rm --entrypoint apk IMAGE info -v | grep openssh-server
    image: ghcr.io/tecnativa/docker-duplicity:edge@sha256:08169ebec4ebc59c0d0b702b40fc541054fc9582e2d1ca7272fd5357749077b2
    container_name: ${SLD}-content-backups-stg
    hostname: ${SLD}-content-backups-stg
    restart: unless-stopped
    volumes:
      - content:/mnt/backup/src:ro
      - backup-cache-content:/root
    environment:
      <<: *backup-env
      DST: boto3+s3://${B2_BUCKET}/${SLD}-backups/content-stg
      CRONTAB_DAILY: ${BACKUP_SLOT_CONTENT}   # nightly slot (UTC) from .env; rule above the backup anchor
  backups-accounts-stg:
    image: ghcr.io/tecnativa/docker-duplicity:edge@sha256:08169ebec4ebc59c0d0b702b40fc541054fc9582e2d1ca7272fd5357749077b2
    container_name: ${SLD}-accounts-backups-stg
    hostname: ${SLD}-accounts-backups-stg
    restart: unless-stopped
    volumes:
      - accounts:/mnt/backup/src:ro
      - backup-cache-accounts:/root
    environment:
      <<: *backup-env
      DST: boto3+s3://${B2_BUCKET}/${SLD}-backups/accounts-stg
      CRONTAB_DAILY: ${BACKUP_SLOT_ACCOUNTS}   # nightly slot (UTC) from .env; rule above the backup anchor
networks:
  default:
    external: true
    name: ${PROXY_NETWORK}
